name: etecsa
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1 

environment:
  sdk: ^3.9.2

dependencies:
  dio: ^5.9.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_riverpod: ^3.2.0
  flutter_secure_storage: ^10.0.0
  formz: ^0.8.0
  go_router: ^17.0.1
  google_fonts: ^7.0.2

  # === NUEVAS DEPENDENCIAS AÑADIDAS ===
  # Base de datos local SQLite
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Seguridad
  encrypt: ^5.0.3
  crypto: ^3.0.3
  # bcrypt: ^1.1.3  # Incompatible, usamos crypto/sha256

  # SMS (fork mantenido compatible con Dart 3.x)
  telephony_sdt: ^0.2.3

  # Utilidades
  uuid: ^4.5.0
  intl: ^0.20.2
  device_info_plus: ^10.0.0
  image_picker: ^1.0.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.0

  # UI/Reportes
  fl_chart: ^0.70.0
  syncfusion_flutter_xlsio: ^28.1.36
  pdf: ^3.11.1

  # Archivos/Sincronización
  share_plus: ^10.0.0
  open_filex: ^4.5.0
  file_picker: ^8.1.0
  permission_handler: ^12.0.3
  # mobile_scanner: ^5.0.0  # Incompatible con Flutter 3.35.x

  # Monetización - commentado por incompatibilidad
  # purchases_flutter: ^7.0.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  drift_dev: ^2.18.0
  sqlite3: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/loaders/